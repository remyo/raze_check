name: raze_check_feature
description: Raze Check feature package.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  raze_check_core:
    path: ../raze_check_core
  flutter_riverpod: 3.4.3
  qr_flutter: 4.1.0
  timezone: 0.11.0
dev_dependencies:
  raze_check_local:
    path: ../raze_check_local
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/OFL.txt
    - assets/branding/raze_check_logo_master.png
